name: Cirrus M4 Pro

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: ghcr.io/cirruslabs/macos-runner:tahoe

    steps:
      - name: Check hardware
        run: |
          echo "Architecture:"
          uname -m

          echo "CPU:"
          sysctl -n hw.ncpu

          echo "RAM:"
          python3 -c "import subprocess; print(int(subprocess.check_output(['sysctl','-n','hw.memsize']))/1024**3, 'GB')"

          echo "CPU:"
          sysctl -n machdep.cpu.brand_string

          sw_vers

      - name: Install tmate
        run: brew install tmate

      - name: Start tmate
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready

          echo "SSH:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'

          echo "WEB:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'

      - name: Keep alive
        run: sleep 1800
