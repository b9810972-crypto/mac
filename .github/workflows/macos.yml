name: M4 Pro tmate

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: warp-macos-26-arm64-6x

    steps:
      - name: Hardware info
        run: |
          echo "=== CPU ==="
          sysctl -n hw.ncpu

          echo "=== RAM ==="
          sysctl -n hw.memsize

          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

      - name: Install tmate
        run: |
          brew install tmate

      - name: Start tmate
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready

          echo "======================================"
          echo "SSH:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo ""
          echo "WEB:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
          echo "======================================"

      - name: Keep alive
        run: |
          sleep 1800
