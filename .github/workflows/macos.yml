name: Cirrus M4 tmate

on:
  workflow_dispatch:

jobs:
  macos:
    name: "M4 Pro tmate"
    runs-on: tenki-standard-small-2c-4g

    steps:
      - name: Show hardware
        run: |
          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

          echo "=== CPU ==="
          sysctl -n hw.ncpu

          echo "=== RAM ==="
          python3 - <<'PY'
          import subprocess
          ram = int(subprocess.check_output(["sysctl", "-n", "hw.memsize"]))
          print(f"{ram / 1024**3:.1f} GB")
          PY

          echo "=== CPU brand ==="
          sysctl -n machdep.cpu.brand_string

      - name: Install tmate
        run: |
          brew install tmate

      - name: Start tmate
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready

          echo "========================================"
          echo "TMATE SSH:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo
          echo "TMATE WEB:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
          echo "========================================"

      - name: Keep runner alive
        run: |
          sleep 1800
